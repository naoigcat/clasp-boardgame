services:
  clasp:
    build:
      context: .
      dockerfile_inline: |
        FROM node:26.7.0-bookworm-slim
        ENV PNPM_HOME=/pnpm
        ENV PATH="$$PNPM_HOME/bin:/deps/node_modules/.bin:$$PATH"
        RUN apt-get update && \
            apt-get install -y curl && \
            curl -fsSL https://get.pnpm.io/install.sh | PNPM_VERSION=11.20.0 SHELL=bash sh -
        WORKDIR /deps
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN pnpm install --frozen-lockfile
        ENV NODE_PATH=/deps/node_modules
        WORKDIR /app
        ENTRYPOINT [ "clasp" ]
    volumes:
      - login:/root
      - $PWD:/app
volumes:
  login:
    driver: local
