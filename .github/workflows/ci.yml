name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Typecheck
        run: |
          docker compose build
          docker compose run --rm --entrypoint bash clasp -c 'npm install --no-save --package-lock=false typescript@5.8.3 @types/google-apps-script@^1.0.81 && npx tsc --noEmit'

      - name: Test
        run: |
          docker compose run --rm --entrypoint bash clasp -c 'npm install --no-save --package-lock=false typescript@5.8.3 && node --test test/*.test.js'
